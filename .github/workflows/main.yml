
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: dotnet build -c Release

      - name: Build Debug
        run: dotnet build -c Debug

      - name: Package builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          foreach ($configuration in @("Release", "Debug")) {
            $stage = "artifacts/$configuration"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            $directories = Get-ChildItem -Path . -Directory -Recurse -Filter $configuration |
              Where-Object { $_.Parent.Name -eq "bin" }

            if (-not $directories) {
              throw "No $configuration build output found!"
            }

            foreach ($directory in $directories) {
              $project = Split-Path (Split-Path $directory.FullName -Parent) -Leaf
              $destination = Join-Path $stage $project

              New-Item -ItemType Directory -Force -Path $destination | Out-Null

              Copy-Item -Path "$($directory.FullName)/*" `
                -Destination $destination -Recurse -Force
            }

            Compress-Archive -Path "$stage/*" `
              -DestinationPath "artifacts/HydraMenu-$configuration.zip" -Force
          }

      - name: Generate tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            $tag = "build-$env:GITHUB_RUN_NUMBER"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/HydraMenu-Release.zip
            artifacts/HydraMenu-Debug.zip
          generate_release_notes: true
          overwrite_files: true
          preserve_order: true
